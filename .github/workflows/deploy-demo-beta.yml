name: 部署demo-beta

on:
  push:
    tags-ignore:
      - 0.*
    branches:
      - main

jobs:
  deploy-beta-gh-pages:
    runs-on: ubuntu-latest
    # 必须与 npm 包 Trusted Publisher 里填写的 Environment name 完全一致
    environment: npm-beta
    permissions:
      contents: write # 推送版本号变更、部署 gh-pages
      id-token: write # Trusted Publishing 换取 npm 短期凭据所必需
    env:
      # webpack 4 用 md4 计算模块 hash，OpenSSL 3 已移除该算法
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check args
        run: |
          echo "${{ github.event }}"
          echo "${{ github.event_path }}"
          echo "${{ github.workflow }}"
          echo "${{ github.job }}"
          echo "${{ github.run_id }}"
          echo "${{ github.repository }}"
          echo "${{ github.repository_owner }}"
          echo "${{ github.ref }}"

      - name: check diff
        id: check_diff
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            src/hiprint/**

      - name: check diff2
        id: check_diff2
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            src/demo/**
            public/**

      - name: 设置 Node.js
        if: ${{ steps.check_diff.outputs.diff || steps.check_diff2.outputs.diff }}
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 >= 22.14
          node-version: 22
          cache: npm
          # 仓库未提交 lockfile，只能拿 package.json 当缓存键
          cache-dependency-path: package.json
          # 这里不能写 registry-url：setup-node 会顺带注入占位 NODE_AUTH_TOKEN，
          # npm 看到它就优先走 token 认证，OIDC 交换不再触发

      - name: 安装依赖
        if: ${{ steps.check_diff.outputs.diff || steps.check_diff2.outputs.diff }}
        run: |
          echo "${{ github.ref }}"
          # package-lock.json 未入库，仓库没有 lockfile，npm ci 会直接失败
          npm install

      - name: 读取当前版本
        id: current
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: up-version
        if: ${{ steps.check_diff.outputs.diff && !startsWith(github.ref, 'refs/tags/0.') }}
        run: |
          git config --local user.email "840054486@qq.com"
          git config --local user.name "github-actions[bot]"
          npm run up-version

      - name: push beta changes
        if: ${{ steps.check_diff.outputs.diff && !startsWith(github.ref, 'refs/tags/0.') }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: 校验待发布版本
        if: ${{ steps.check_diff.outputs.diff && !startsWith(github.ref, 'refs/tags/0.') }}
        env:
          OLD_VERSION: ${{ steps.current.outputs.version }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          NEW=$(node -p "require('./package.json').version")
          echo "::notice::$NAME $OLD_VERSION -> $NEW"
          if [ "$NEW" = "$OLD_VERSION" ]; then
            echo "::error::版本号未变化，scripts/change-version.js 可能执行失败"
            exit 1
          fi
          if [ -n "$(npm view --registry https://registry.npmjs.org/ "$NAME@$NEW" version 2>/dev/null)" ]; then
            echo "::error::版本 $NEW 已发布过，请勿重复发布"
            exit 1
          fi

      - name: 构建产物
        if: ${{ steps.check_diff.outputs.diff && !startsWith(github.ref, 'refs/tags/0.') }}
        run: npm run build

      - name: 升级 npm
        if: ${{ steps.check_diff.outputs.diff && !startsWith(github.ref, 'refs/tags/0.') }}
        # Trusted Publishing 要求 npm >= 11.5.1，runner 自带的版本不满足
        run: npm install -g npm@^11.5.1

      - name: pubBeta
        if: ${{ steps.check_diff.outputs.diff && !startsWith(github.ref, 'refs/tags/0.') }}
        # --tag beta 必填，npm 强制预发布版本必须显式指定 tag；
        # 不传 NODE_AUTH_TOKEN，npm 会自动用 OIDC 换短期凭据
        run: npm publish --tag beta --provenance --access public --registry https://registry.npmjs.org/

      - name: 构建demo
        if: ${{ steps.check_diff.outputs.diff || steps.check_diff2.outputs.diff }}
        env:
          # 步骤级 env 会覆盖 job 级 env，legacy provider 要在这里重复声明
          NODE_OPTIONS: --max_old_space_size=8192 --openssl-legacy-provider
        run: |-
          npm run build-demo
          > demo/.nojekyll

      - name: githubPage
        if: ${{ steps.check_diff.outputs.diff || steps.check_diff2.outputs.diff }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: demo

      - name: gitee同步
        uses: wearerequired/git-mirror-action@master
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_KEY }}
        with:
          source-repo: git@github.com:CcSimple/vue-plugin-hiprint.git
          destination-repo: git@gitee.com:CcSimple/vue-plugin-hiprint.git

      - name: giteePages
        if: ${{ steps.check_diff.outputs.diff || steps.check_diff2.outputs.diff }}
        uses: yanglbme/gitee-pages-action@master
        with:
          gitee-username: CcSimple
          gitee-password: ${{ secrets.GITEE_PASSWORD }}
          gitee-repo: CcSimple/vue-plugin-hiprint
          branch: gh-pages
